<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sibasish Barik — Robotics &amp; Autonomous Systems</title>
    <meta name="description"
          content="Sibasish Barik builds autonomous drones and ground robots: hardware, perception, control and field validation.">

    <!-- Set the theme before first paint so there is no flash -->
    <script>
        try {
            if (localStorage.getItem("portfolio-theme") === "light") {
                document.documentElement.dataset.initialTheme = "light";
            }
        } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/apricot" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/brittany" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/projects.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/hobbies.css">
    <link rel="stylesheet" href="css/experience.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- =====================================================
         PRELOADER
    ====================================================== -->
    <div class="preloader" id="preloader" aria-label="Loading portfolio" role="status">
        <div class="preloader-track">
            <span class="preloader-fill"></span>
        </div>
    </div>

    <!-- =====================================================
         NAVIGATION
    ====================================================== -->
    <header class="site-header">
        <nav class="navbar">

            <a href="#home" class="brand">
                <span class="brand-mark">SB</span>
                <span class="brand-name">SIBASISH BARIK</span>
            </a>

            <div class="nav-links" id="navLinks">
                <a href="#work" class="nav-link">Work</a>
                <a href="#experience" class="nav-link">Experience</a>
                <a href="#about" class="nav-link">About</a>
                <a href="#contact" class="nav-link">Contact</a>
            </div>

            <div class="nav-actions">

                <!-- THEME SWITCH — unchecked = dark, checked = light -->
                <label class="theme-switch" for="themeSwitch" title="Toggle theme">
                    <input id="themeSwitch" type="checkbox"
                           aria-label="Switch between dark and light mode">

                    <span class="theme-knob" aria-hidden="true"></span>

                    <span class="theme-icon theme-moon" aria-hidden="true">
                        <svg viewBox="0 0 384 512" xmlns="http://www.w3.org/2000/svg">
                            <path d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"></path>
                        </svg>
                    </span>

                    <span class="theme-icon theme-sun" aria-hidden="true">
                        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                            <path d="M256 112a144 144 0 1 0 0 288 144 144 0 1 0 0-288zM232 0h48v72h-48V0zm0 440h48v72h-48v-72zM0 232h72v48H0v-48zm440 0h72v48h-72v-48zM60 94l34-34 51 51-34 34L60 94zm307 307l34-34 51 51-34 34-51-51zM94 452l-34-34 51-51 34 34-51 51zM401 111l-34-34 51-51 34 34-51 51z"></path>
                        </svg>
                    </span>
                </label>

                <a href="assets/Sibasish_Barik_Resume.pdf" class="resume-button" target="_blank" rel="noopener">
                    <span>Resume</span>
                    <span aria-hidden="true">↗</span>
                </a>

                <button class="nav-toggle" id="navToggle" aria-label="Open menu">
                    <span></span>
                </button>
            </div>

        </nav>
    </header>


    <!-- Sections are injected here by js/main.js -->
    <main id="page-sections"></main>


    <footer class="site-footer">
        <div class="footer-inner footer-signature-row">
            <a href="#home" class="footer-signature" aria-label="Back to the top">
                <span class="signature-sb">SB</span>
            </a>

            <p class="footer-made">
                Created with <a href="#home" class="footer-heart" aria-label="Back to the hero">♥</a>
            </p>

            <p class="footer-copy">© 2026</p>
        </div>
    </footer>

    <script type="module" src="js/main.js"></script>
